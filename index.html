<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Viveka 5.0 – Live Registration Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#020617;
  color:white;
  text-align:center;
}

h1{
  margin-top:20px;
}

.big{
  font-size:60px;
  font-weight:bold;
  margin-top:10px;
}

.progress{
  width:80%;
  background:#1e293b;
  margin:20px auto;
  border-radius:30px;
  overflow:hidden;
}

.bar{
  height:24px;
  width:0%;
  background:#22c55e;
  transition:1s;
}

#events{
  margin-top:20px;
}

.card{
  background:#0f172a;
  padding:15px;
  margin:10px;
  border-radius:12px;
  display:inline-block;
  min-width:200px;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<h1>Viveka - The Intelligence 5.0 - Live Dashboard</h1>

<div class="big">
  Total Registration (<span id="total">0</span>)
</div>
<div>Target: 2000+</div>

<div class="progress">
  <div class="bar" id="progressBar"></div>
</div>

<canvas id="chart" width="600" height="300"></canvas>

<h2>Events</h2>
<div id="events"></div>

<script>

const TARGET = 2000;

const URL="https://docs.google.com/spreadsheets/d/1z_arXbcnaqmxOt5caWUchEBDP_MFhMq2tUIfZgWkiRY/gviz/tq?tqx=out:json&gid=1087578816";

let chart=null;

function loadData(){

fetch(URL)
.then(res=>res.text())
.then(data=>{

const json=JSON.parse(data.substring(47).slice(0,-2));
const rows=json.table.rows;

let labels=[];
let values=[];
let html="";

/*
Your Sheet Structure:
A = Events
B = Registrations
E1 = Total Registration
*/

// ✅ TOTAL from E1
const total = rows[0]?.c[5]?.v || 0;

// ✅ Events start from row index 1
for(let i=1;i<rows.length;i++){

 const event = rows[i]?.c[0]?.v;
 const count = rows[i]?.c[1]?.v;

 if(!event || count==null) continue;

 labels.push(event);
 values.push(count);

 html+=`
 <div class="card">
   <h3>${event}</h3>
   <p>${count} registrations</p>
 </div>`;
}

document.getElementById("events").innerHTML=html;
document.getElementById("total").innerText=total;

// Progress Bar
let percent=Math.min((total/TARGET)*100,100);
document.getElementById("progressBar").style.width=percent+"%";

// Chart
if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{
 type:"bar",
 data:{
  labels:labels,
  datasets:[{
    label:"Registrations",
    data:values
  }]
 },
options:{
 responsive:true,
 scales:{
   y:{
     beginAtZero:true,
     max:200,        // top value
     ticks:{
       stepSize:20    // 0,8,16,24...
     }
   }
 }
}
});

});

}

// Initial Load
loadData();

// Auto Refresh every 10 seconds
setInterval(loadData,10000);

</script>

</body>
</html>
