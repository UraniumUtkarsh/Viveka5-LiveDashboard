<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 — Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Your existing styles -->
  <link rel="stylesheet" href="style1.css" />

  <!-- Favicon -->
  <link rel="icon" href="favicon_io/favicon.ico" />

  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .error-card {
      max-width: 520px;
      padding: 3rem;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    .error-text {
      opacity: 0.8;
    }

    .glow-line {
      height: 2px;
      width: 120px;
      margin: 1.5rem auto;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      box-shadow: 0 0 20px var(--neon-cyan);
    }
  </style>
</head>

<body>
  <div class="error-wrapper bg-[radial-gradient(circle_at_center,transparent_0%,rgba(2,6,23,0.9)_100%)]">

    <!-- subtle background grid -->
    <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:30px_30px] opacity-10"></div>

    <div class="glass-panel error-card relative z-10 backdrop-blur-xl border border-neon-cyan/20">
      <div class="error-code text-neon-cyan text-glow">404</div>

      <div class="glow-line"></div>

      <h2 class="text-2xl font-semibold mb-2">Page Not Found</h2>
      <p class="error-text text-sm mb-6">
        The resource you’re trying to access doesn’t exist or has been moved.
      </p>

      <a href="/" class="inline-flex items-center gap-2 px-6 py-2 rounded-full bg-neon-cyan/10 hover:bg-neon-cyan/20 border border-neon-cyan/30 transition">
        <span class="text-neon-cyan font-semibold">← Back to Home</span>
      </a>
    </div>
  </div>
</body>
</html>
